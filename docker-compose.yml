services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aerodoc-pgvector
    environment:
      # Values come from the .env file (see .env.example); no default on purpose.
      POSTGRES_USER: ${PG_USER:?PG_USER is not set in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is not set in .env}
      POSTGRES_DB: ${PG_DB:?PG_DB is not set in .env}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
